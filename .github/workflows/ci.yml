name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Reuse the Makefile target so CI and a local run cannot drift apart.
      - name: Verify gofmt
        run: make fmt-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -short keeps the live-provider smoke test out of CI: it depends on four
      # third-party music platforms and would make the build flaky.
      - name: Test
        run: go test -short -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned rather than "latest" so a new linter release cannot turn the
      # build red without a commit here. v2 is required by the .golangci.yml
      # schema.
      - name: Lint
        run: |
          docker run --rm \
            -v "$PWD":/app -w /app \
            -e GOFLAGS=-mod=readonly \
            golangci/golangci-lint:v2.13.2 \
            golangci-lint run --timeout 5m

  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The project's selling point is a single static binary with no CGO, so
      # every release target must actually build.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/server
