name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A weekly run catches issues that only appear once the query packs are
  # updated, even when the code has not changed.
  schedule:
    - cron: "27 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # read the workflow run metadata
      packages: read # fetch the CodeQL query packs
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: go
          queries: security-and-quality

      # Builds the project the way CodeQL needs; requires no custom commands
      # because this is a plain `go build`.
      - uses: github/codeql-action/autobuild@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3

      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: "/language:go"
