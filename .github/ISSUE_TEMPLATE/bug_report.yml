name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the README's compatibility table — a
        mismatch with `lrclib.net` may already be documented as a known
        difference.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Also tell us what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        For an API problem, the exact request is the most useful thing you can
        give us.
      placeholder: |
        curl -s "http://localhost:3300/api/get?track_name=...&artist_name=..."
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: Actual response
      description: Include the status code and body, plus any relevant log line.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From the startup banner, or the release tag.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/arch, and how you run it (binary, Docker, NAS package).
      placeholder: Debian 12 / amd64, Docker
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Which client made the request?
      options:
        - A music player (Symfonium, ZZMusicPlayer, ...)
        - curl / manual request
        - My own application
        - Other
    validations:
      required: true
