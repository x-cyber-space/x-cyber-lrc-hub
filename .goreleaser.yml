# GoReleaser configuration — https://goreleaser.com
#
# Validate with:  goreleaser check
# Dry run with:   goreleaser release --snapshot --clean
version: 2

project_name: x-cyber-lrc-hub

# Deliberately no `go mod tidy` hook.
#
# A release must build exactly what the tag points at. Running tidy here could
# rewrite go.mod/go.sum mid-release, so the published binary would no longer
# correspond to the tagged source — and it drags the full module graph
# (including the test dependencies of our dependencies) into every release.
# `go build` fetches whatever go.mod already requires.

builds:
  - id: x-cyber-lrc-hub
    main: ./cmd/server
    binary: x-cyber-lrc-hub
    # The project's core promise is a single static binary with no CGO: the
    # SQLite driver is pure Go.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/SPEC.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^Merge pull request"

release:
  # Releases start as a draft so the notes can be reviewed before publishing.
  draft: true
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/x-cyber-space/x-cyber-lrc-hub/compare/{{ .PreviousTag }}...{{ .Tag }}
